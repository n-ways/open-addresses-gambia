components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: "Stable error code, for programs"
            message:
              type: string
              description: "Explanation, for people"
            existing:
              $ref: "#/components/schemas/Card"
              description: "On 409 exists: the code the building already has"
    Health:
      type: object
      required:
        - status
        - country
        - codes
      properties:
        status:
          type: string
          enum:
            - ok
        country:
          type: string
        codes:
          type: integer
        registryExported:
          type:
            - string
            - "null"
          format: date-time
        issuing:
          type: boolean
          description: Whether this deployment issues codes
    Zone:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
          enum:
            - BJL
            - CRR
            - KMC
            - LRR
