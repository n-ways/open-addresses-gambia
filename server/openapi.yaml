# OpenAPI contract of the registry server (server/). Examples are real responses.
openapi: "3.1.0"
info:
  title: "N-Ways Addressing for The Gambia: registry API"
  version: "1"
  summary: "The published home codes of The Gambia, their look-ups and, on a designated deployment, issuing."
  description: "Served by `python3 -m server serve` (server/README.md). Every example is a real response from a server holding the complete published registry. Errors are {\"error\": {\"code\", \"message\"}} with the matching HTTP status."
  contact:
    name: N-WAYS LIMITED
    url: "https://nways.ng"
    email: "hello@nways.ng"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "http://localhost:8080"
    description: A local deployment (docker compose up)
paths:
  /v1/health:
    get:
      summary: Health and size of the registry served
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                health:
                  value:
                    status: ok
                    country: GM
                    codes: 471031
                    registryExported: "2026-10-20T15:53:35Z"
                    issuing: false
  /v1/info:
    get:
      summary: "Country, zones, counts, licences and credit"
      operationId: info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
              examples:
                info:
                  value:
                    country: GM
                    name: The Gambia
                    zones:
                      - key: BJL
                        index: 0
                        name: Banjul
                        iso: GM-B
                        codes: 4320
                        areas: 1
